services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - compliance_reports:/app/reports

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:?Set SENTINEL_API_KEY before starting}
    volumes:
      - compliance_reports:/app/reports

volumes:
  compliance_reports:
